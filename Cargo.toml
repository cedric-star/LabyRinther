[package]
name = "LabyRinther"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
avian2d = "0.8.0"
bevy_enoki = "0.8.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1 # compile to a single crate -> slower compile faster execution
lto = "thin" # second optimization while compile

[profile.wasm-release]
inherits = "release"
opt-level = "s" # decrease file size and runtime performance
strip = "debuginfo" # strip debug info for smaller file
